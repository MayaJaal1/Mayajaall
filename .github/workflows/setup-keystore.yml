name: Setup Keystore (One Time)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore mayajaal-release.jks \
            -alias mayajaal \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MayajaalRelease2024 \
            -keypass MayajaalRelease2024 \
            -dname "CN=MayaJaal, OU=Dev, O=MayaJaal, L=Delhi, S=Delhi, C=IN"

      # 🌟 YEH NAYA STEP HAI: Ab yeh SHA1 aur SHA256 dono nikalega
      - name: Get SHA1 and SHA256 Fingerprints
        run: |
          echo "=========================================="
          echo "SHA1 FINGERPRINT (YEH COPY KAREIN - Firebase ke liye):"
          echo "=========================================="
          keytool -list -v -keystore mayajaal-release.jks \
            -alias mayajaal \
            -storepass MayajaalRelease2024 \
            -keypass MayajaalRelease2024 | grep "SHA1:"
          echo "=========================================="
          echo "SHA256 FINGERPRINT (YEH COPY KAREIN - assetlinks.json ke liye):"
          echo "=========================================="
          keytool -list -v -keystore mayajaal-release.jks \
            -alias mayajaal \
            -storepass MayajaalRelease2024 \
            -keypass MayajaalRelease2024 | grep "SHA256:"
          echo "=========================================="

      - name: Get Base64 (Copy this)
        run: |
          echo "=========================================="
          echo "BASE64 KEYSTORE (Copy this):"
          echo "=========================================="
          base64 -w 0 mayajaal-release.jks
          echo ""
          echo "=========================================="

      - name: Upload Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: keystore-file
          path: mayajaal-release.jks
