name: Setup Keystore (One Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Abort if keystore already exists
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "mayajaal-release.jks" ]; then
            echo "::error::mayajaal-release.jks already repo mein hai."
            echo "::error::Ise re-run karne se NAYA keystore banega aur SHA badal jayegi."
            echo "::error::Agar jaan-boojh kar naya keystore chahiye, to pehle manually delete karo, phir run karo."
            exit 1
          fi

          echo "✅ Koi existing keystore nahi mila - naya banega"

      - name: Delete old backup keystore (safe)
        shell: bash
        run: |
          # NOTE: mayajaal-release.jks ko yahan delete NAHI kar rahe.
          # Sirf purane backup file ko hata rahe hain.
          rm -f mayajaal-new.jks
          echo "✅ Backup cleanup done"

      - name: Generate New Keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore mayajaal-release.jks \
            -alias newkey2024 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MayajaalRelease2024 \
            -keypass MayajaalRelease2024 \
            -dname "CN=MayaJaal, OU=Dev, O=MayaJaal, L=Delhi, S=Delhi, C=IN" \
            -noprompt

      - name: Get SHA1 and SHA256
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "  SHA FINGERPRINTS (YAHAN SE COPY KARO):"
          echo "=========================================================="
          keytool -list -v -keystore mayajaal-release.jks \
            -alias newkey2024 \
            -storepass MayajaalRelease2024 \
            -keypass MayajaalRelease2024 | grep -iE "SHA1:|SHA256:"
          echo "=========================================================="
          echo "  SHA256 ko assetlinks.json ke sha256_cert_fingerprints"
          echo "  mein daalo (colon ke saath, uppercase)."
          echo "=========================================================="

      - name: Commit new keystore to repository
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MayaJaal Bot"
          git config --global user.email "bot@mayajaal.online"
          git add mayajaal-release.jks
          git commit -m "New keystore - new SHA1 and SHA256" || echo "No changes to commit"
          git pull origin main --rebase
          git push origin main

      - name: Upload Keystore Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mayajaal-keystore
          path: mayajaal-release.jks
          if-no-files-found: error
