                fullButton = action("Load interstitial", () -> loadFull(false));
                rewardedButton = action("Load rewarded video (no cash)", () -> loadFull(true));
                showButton = action("Show loaded full-screen ad", this::showFull);
                action("Clear test ads", this::clear);
                nativeButton = action("Load native ad", this::loadNative);
                nativeSlot = new FrameLayout(this);
                root.addView(nativeSlot, new LinearLayout.LayoutParams(-1, -2));
                vastButton = action("VAST video test • 10000900541", () -> {
                    if (foreground && ready && !loading && !showing && !nativeOverlay) {
                        try {
                            dropNative(); dropBanner();
                            startActivity(new Intent(this, MayaVastTrialActivity.class));
                        } catch (RuntimeException | LinkageError e) {
                            android.util.Log.e("MayaVastTrial", "Unable to open VAST test", e);
                            update("VAST launch failed: " + e.getClass().getSimpleName() + ": " + e.getMessage());
                        }
                    }
                });
                root.addView(label("VAST: official sample tag or an HTTPS test tag supplied by InMobi. The sample is not connected to MayaJaal earnings.", 14));
                update("Ready to initialize after confirming test mode.");
            }
            private void initialize() {
                if (dead || ready || loading) return; loading = true; update("Initializing SDK…");
                final int id = ++generation;
                try {
                    InMobiSdk.init(this, ACCOUNT, null, error -> runOnUiThread(() -> {
                        if (dead || id != generation) return; loading = false; ready = error == null;
                        update(ready ? "SDK initialized. Select a test format." : "SDK initialization failed: " + error.getMessage());
                    }));
                } catch (Exception e) { loading = false; update("SDK error: " + e.getMessage()); }
            }
            private void loadBanner() {
                if (!ready || loading || showing || banner != null) return;
                if (bannerSlot.getWidth() < dp(320)) { update("Banner needs 320dp width. Rotate device or use a wider screen."); return; }
                try {
                    final InMobiBanner ad = new InMobiBanner(this, BANNER); banner = ad;
                    ad.setListener(new BannerAdEventListener() {
                        @Override public void onAdLoadSucceeded(InMobiBanner a, AdMetaInfo info) { if (!dead && banner == a) update("Banner loaded."); }
                        @Override public void onAdLoadFailed(InMobiBanner a, InMobiAdRequestStatus s) {
                            if (!dead && banner == a) { banner = null; bannerSlot.removeAllViews(); a.destroy(); update("Banner failed: " + s.getMessage()); }
                        }
                    });
                    FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(dp(320), dp(50), Gravity.CENTER);
                    bannerSlot.addView(ad, lp); update("Requesting banner…"); ad.load();
                } catch (Exception e) { dropBanner(); update("Banner error: " + e.getMessage()); }
            }
            private void loadFull(boolean isReward) {
                if (!ready || loading || showing || full != null) return;
                loading = true; reward = isReward; rewardEarned = false;
                update(isReward ? "Loading rewarded video…" : "Loading interstitial…");
                try {
                    full = new InMobiInterstitial(this, isReward ? REWARDED : INTERSTITIAL, new InterstitialAdEventListener() {
                        @Override public void onAdLoadSucceeded(InMobiInterstitial a, AdMetaInfo info) {
                            if (!dead && full == a) { loading = false; update("Ad loaded. Press Show to test."); }
                        }
                        @Override public void onAdLoadFailed(InMobiInterstitial a, InMobiAdRequestStatus s) {
                            if (!dead && full == a) { full = null; loading = false; update("Load failed: " + s.getMessage()); }
                        }
                        @Override public void onAdDisplayFailed(InMobiInterstitial a) {
                            if (!dead && full == a) { full = null; showing = false; loading = false; update("Display failed. Request a fresh test ad."); }
                        }
                        @Override public void onAdDismissed(InMobiInterstitial a) {
                            if (!dead && full == a) { full = null; showing = false; loading = false; update(reward ? (rewardEarned ? "Reward callback received. No money credited." : "Video closed without reward callback.") : "Interstitial closed."); }
                        }
                        @Override public void onRewardsUnlocked(InMobiInterstitial a, Map<Object,Object> rewards) {
                            if (!dead && full == a && reward) { rewardEarned = true; }
                        }
                    }); full.load();
                } catch (Exception e) { full = null; loading = false; update("Load error: " + e.getMessage()); }
            }
            private void showFull() {
                if (dead || !foreground || loading || showing || nativeOverlay || full == null) return;
                try { if (!full.isReady()) { full = null; update("Ad expired or not ready. Load again."); return; } showing = true; update("Showing ad…"); full.show(); }
                catch (Exception e) { full = null; showing = false; update("Show error: " + e.getMessage()); }
            }
            private void loadNative() {
                if (!ready || dead || !foreground || loading || showing || nativeAd != null) return;
                loading = true; update("Requesting native ad…");
                try {
                    nativeAd = new InMobiNative(this, NATIVE, new NativeAdEventListener() {
                        @Override public void onAdLoadSucceeded(InMobiNative ad, AdMetaInfo info) {
                            runOnUiThread(() -> {
                                if (dead || nativeAd != ad) return;
                                loading = false;
                                if (!foreground) { dropNative(); update("Native load cancelled in background."); return; }
                                try { renderNative(ad); update("Native ad loaded. SDK handles impression and click tracking."); }
                                catch (Exception e) { dropNative(); update("Native rendering failed: " + e.getMessage()); }
                            });
                        }
                        @Override public void onAdLoadFailed(InMobiNative ad, InMobiAdRequestStatus s) {
                            runOnUiThread(() -> { if (!dead && nativeAd == ad) { loading = false; dropNative(); update("Native failed: " + s.getMessage()); } });
                        }
                        @Override public void onAdFullScreenDisplayed(InMobiNative ad) { if (nativeAd == ad) nativeOverlay = true; }
                        @Override public void onAdFullScreenDismissed(InMobiNative ad) { if (nativeAd == ad) { nativeOverlay = false; update("Native ad overlay closed."); } }
                    });
                    nativeAd.load();
                } catch (Exception e) { loading = false; dropNative(); update("Native error: " + e.getMessage()); }
            }
            private void renderNative(InMobiNative ad) {
                if (!ad.isReady()) throw new IllegalStateException("Ad not ready");
                LinearLayout card = new LinearLayout(this); card.setOrientation(LinearLayout.VERTICAL);
                card.setPadding(dp(12), dp(12), dp(12), dp(12)); card.setBackgroundColor(0xff14221c);
                LinearLayout heading = new LinearLayout(this); heading.setGravity(Gravity.CENTER_VERTICAL);
                TextView sponsored = label("Sponsored • " + (ad.getAdvertiserName() == null ? "" : ad.getAdvertiserName()), 12);
                heading.addView(sponsored, new LinearLayout.LayoutParams(0, -2, 1));
                View choices = ad.getAdChoiceIcon();
                if (choices != null) { detach(choices); heading.addView(choices, new LinearLayout.LayoutParams(-2, -2)); }
                card.addView(heading);
                ImageView icon = new ImageView(this); icon.setScaleType(ImageView.ScaleType.FIT_CENTER);
                if (ad.getAdIcon() != null && ad.getAdIcon().getUrl() != null && !ad.getAdIcon().getUrl().isEmpty()) {
                    card.addView(icon, new LinearLayout.LayoutParams(dp(48), dp(48)));
                    Picasso.get().load(ad.getAdIcon().getUrl()).into(icon);
                }
                TextView title = label(ad.getAdTitle(), 20), description = label(ad.getAdDescription(), 14);
                card.addView(title); card.addView(description);
                View media = ad.getMediaView();
                if (media != null) { detach(media); card.addView(media, new LinearLayout.LayoutParams(-1, dp(190))); }
                Button cta = new Button(this); cta.setAllCaps(false); cta.setText(ad.getCtaText()); card.addView(cta);
                nativeSlot.removeAllViews(); nativeSlot.addView(card, new FrameLayout.LayoutParams(-1, -2));
                InMobiNativeViewData.Builder builder = new InMobiNativeViewData.Builder(card)
                    .setTitleView(title).setDescriptionView(description).setCTAView(cta)
                    .setExtraViews(Collections.singletonList(sponsored));
                if (icon.getParent() != null) builder.setIconView(icon);
                ad.registerViewForTracking(builder.build());
            }
            private void detach(View view) { if (view.getParent() instanceof ViewGroup) ((ViewGroup) view.getParent()).removeView(view); }
            private void dropNative() {
                InMobiNative old = nativeAd; nativeAd = null; nativeOverlay = false;
                if (nativeSlot != null) nativeSlot.removeAllViews();
                if (old != null) {
                    try { old.unTrackViews(); } catch (RuntimeException | LinkageError e) { android.util.Log.e("MayaVastTrial", "Native untrack failed", e); }
                    try { old.destroy(); } catch (RuntimeException | LinkageError e) { android.util.Log.e("MayaVastTrial", "Native destroy failed", e); }
                }
            }
            private void dropBanner() { InMobiBanner old = banner; banner = null; if (bannerSlot != null) bannerSlot.removeAllViews(); if (old != null) old.destroy(); }
            private void clear() { if (showing || loading || nativeOverlay) return; dropBanner(); dropNative(); full = null; update("Test ads cleared."); }
            @Override protected void onResume() { super.onResume(); foreground = true; if (status != null) update(status.getText().toString()); }
            @Override protected void onPause() { foreground = false; dropBanner(); super.onPause(); }
            @Override protected void onDestroy() { dead = true; generation++; dropBanner(); dropNative(); full = null; super.onDestroy(); }
        }
        EOFADS

        cat > android/app/src/main/java/com/mayajaal/online/MayaVastTrialActivity.java <<'EOFVAST'
        package com.mayajaal.online;

        import android.app.Activity;
        import android.os.Bundle;
        import android.net.Uri;
        import android.graphics.Color;
        import android.widget.*;
        import androidx.media3.common.MediaItem;
        import androidx.media3.common.Player;
        import androidx.media3.common.PlaybackException;
        import androidx.media3.exoplayer.ExoPlayer;
        import androidx.media3.exoplayer.ima.ImaAdsLoader;
        import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
        import androidx.media3.ui.PlayerView;
        import androidx.media3.common.util.UnstableApi;

        @UnstableApi
        public final class MayaVastTrialActivity extends Activity {
            private static final String SAMPLE = "https://pubads.g.doubleclick.net/gampad/ads?iu=/21775744923/external/single_ad_samples&sz=640x480&cust_params=sample_ct%3Dlinear&ciu_szs=300x250%2C728x90&gdfp_req=1&output=vast&unviewed_position_start=1&env=vp&correlator=";
            private static final String CONTENT = "https://storage.googleapis.com/gvabox/media/samples/stock.mp4";
            private PlayerView view;
            private FrameLayout playerSlot;
            private TextView status;
            private ExoPlayer player;
            private ImaAdsLoader loader;
            private int generation;
            private boolean scheduled, adStarted, adFinished;
            private final android.os.Handler timer = new android.os.Handler(android.os.Looper.getMainLooper());
            private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
            @Override public void onCreate(Bundle state) {
                super.onCreate(state);
                if (!MayaAdsMode.TRIAL) { setResult(RESULT_CANCELED); finish(); return; }
                scheduled = getIntent().getBooleanExtra("scheduled_test",false);
                LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                root.setPadding(dp(12),dp(12),dp(12),dp(12)); root.setBackgroundColor(0xff080e0b);
                setContentView(root);
                Button back = new Button(this); back.setText(scheduled ? "Return to video" : "Back to Ad Test Lab"); back.setOnClickListener(v -> {if(scheduled)endBreak(adStarted);else finish();}); root.addView(back);
                if(scheduled){
                    status=new TextView(this);status.setTextColor(Color.WHITE);status.setText("Advertisement • private test (no earnings)");root.addView(status);
                    playerSlot=new FrameLayout(this);root.addView(playerSlot,new LinearLayout.LayoutParams(-1,0,1));
                    String testTag=getIntent().getStringExtra("test_tag");
                    String chosen=(testTag==null || testTag.isEmpty())?SAMPLE+System.currentTimeMillis():testTag;
                    playerSlot.post(()->{if(!isFinishing())play(chosen);});
                    return;
                }
                TextView header = new TextView(this); header.setTextColor(Color.WHITE); header.setTextSize(18);
                header.setText("VAST test • MayaJaal placement 10000900541\nGoogle sample is non-revenue. Use only an InMobi-approved HTTPS test tag. No automatic requests."); root.addView(header);
                EditText tag = new EditText(this); tag.setSingleLine(true); tag.setTextColor(Color.WHITE); tag.setHintTextColor(0xff9da8a0); tag.setHint("InMobi test tag URL (optional)"); root.addView(tag);
                Button sample = new Button(this); sample.setText("Play official sample ad"); sample.setOnClickListener(v -> play(SAMPLE + System.currentTimeMillis())); root.addView(sample);
                Button custom = new Button(this); custom.setText("Play approved InMobi test tag"); custom.setOnClickListener(v -> {
                    String raw = tag.getText().toString().trim(); Uri uri = Uri.parse(raw);
                    if (!"https".equalsIgnoreCase(uri.getScheme()) || uri.getHost() == null || uri.getUserInfo() != null) { status.setText("An approved HTTPS tag is required."); return; }
                    play(raw);
                }); root.addView(custom);
                status = new TextView(this); status.setTextColor(Color.WHITE); status.setText("Not started"); root.addView(status);
                playerSlot = new FrameLayout(this);
                root.addView(playerSlot, new LinearLayout.LayoutParams(-1,0,1));
            }
            private void endBreak(boolean shown){
                if(isFinishing())return;
                adFinished=true;timer.removeCallbacksAndMessages(null);
                setResult(shown ? RESULT_OK : RESULT_CANCELED);finish();
            }
            private void play(String tag) {
                release(); final int current = generation;
                if(scheduled){
                    timer.postDelayed(()->{if(current==generation && !adStarted)endBreak(false);},25000);
                    timer.postDelayed(()->{if(current==generation)endBreak(adStarted);},180000);
                }
                status.setText("Requesting video ad…");
                try {
                    if (view == null) {
                        PlayerView newView = new PlayerView(this);
                        playerSlot.addView(newView, new FrameLayout.LayoutParams(-1,-1));
                        view = newView;
                    }
                    loader = new ImaAdsLoader.Builder(this)
                        .setAdEventListener(event -> {
                            if (current != generation) return;
                            switch (event.getType()) {
                                case STARTED: adStarted=true; status.setText("Video ad started"); break;
                                case COMPLETED: status.setText("Video ad completed"); if(scheduled)timer.post(()->endBreak(true)); break;
                                case SKIPPED: status.setText("Video ad skipped"); if(scheduled)timer.post(()->endBreak(adStarted)); break;
                                case ALL_ADS_COMPLETED: if(scheduled)timer.post(()->endBreak(adStarted)); break;
                                default: break;
                            }
                        })
                        .setAdErrorListener(event -> { if (current == generation) {status.setText("Ad error / no fill: " + event.getError().getErrorCode()); if(scheduled)timer.post(()->endBreak(false));} })
                        .build();
                    DefaultMediaSourceFactory factory = new DefaultMediaSourceFactory(this).setLocalAdInsertionComponents(uri -> loader, view);
                    player = new ExoPlayer.Builder(this).setMediaSourceFactory(factory).build();
                    view.setPlayer(player); loader.setPlayer(player);
                    player.addListener(new Player.Listener() {
                        @Override public void onPlayerError(PlaybackException error) { if (current == generation) {status.setText("Player error: " + error.getErrorCodeName());if(scheduled)timer.post(()->endBreak(false));} }
                        @Override public void onIsPlayingChanged(boolean playing) { if(scheduled && current==generation && playing && player!=null && !player.isPlayingAd())timer.post(()->endBreak(adStarted)); }
                    });
                    player.setMediaItem(new MediaItem.Builder().setUri(CONTENT).setAdsConfiguration(new MediaItem.AdsConfiguration.Builder(Uri.parse(tag)).build()).build());
                    player.prepare(); player.play();
                } catch (RuntimeException | LinkageError e) {
                    android.util.Log.e("MayaVastTrial", "VAST setup failed", e);
                    release();
                    status.setText("VAST setup failed: " + e.getClass().getSimpleName() + ": " + e.getMessage());
                    if(scheduled)endBreak(false);
                }
            }
            private void cleanup(Runnable action) {
                try { action.run(); } catch (RuntimeException | LinkageError e) {
                    android.util.Log.e("MayaVastTrial", "VAST cleanup failed", e);
                }
            }
            private void release() {
                generation++;
                ImaAdsLoader oldLoader = loader; loader = null;
                ExoPlayer oldPlayer = player; player = null;
                if (oldLoader != null) cleanup(() -> oldLoader.setPlayer(null));
                if (view != null) cleanup(() -> view.setPlayer(null));
                if (oldPlayer != null) cleanup(oldPlayer::release);
                if (oldLoader != null) cleanup(oldLoader::release);
            }
            @Override protected void onPause() { release(); if(scheduled && !adFinished && !isFinishing())endBreak(adStarted); super.onPause(); }
            @Override protected void onDestroy() { timer.removeCallbacksAndMessages(null); release(); super.onDestroy(); }
        }
