                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="http"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SENDTO"/>
                    <data android:scheme="mailto"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SEND"/>
                    <data android:mimeType="text/plain"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SEND"/>
                    <data android:mimeType="image/*"/>
                </intent>
            </queries>
        </manifest>
        EOF
    - name: Create app build.gradle
      shell: bash
      run: |
        cat > android/app/build.gradle <<'EOF'
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "com.google.gms.google-services"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace 'com.mayajaal.online'
            compileSdkVersion 36
            ndkVersion "27.0.12077973"

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
                coreLibraryDesugaringEnabled true
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            defaultConfig {
                applicationId "com.mayajaal.online"
                minSdkVersion 23
                targetSdkVersion 35
                versionCode flutter.versionCode
                versionName flutter.versionName
                multiDexEnabled true
            }

            signingConfigs {
                release {
                    storeFile file('mayajaal-release.jks')
                    storePassword System.getenv('MAYAJAAL_STORE_PASSWORD')
                    keyAlias System.getenv('MAYAJAAL_KEY_ALIAS')
                    keyPassword System.getenv('MAYAJAAL_KEY_PASSWORD')
                }
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        dependencies {
            coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
            implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
            implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
            implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.5.1'
            implementation 'com.startapp:inapp-sdk:5.4.0'
            implementation 'androidx.media3:media3-exoplayer:1.4.1'
            implementation 'androidx.media3:media3-exoplayer-ima:1.4.1'
            implementation 'androidx.media3:media3-ui:1.4.1'
            implementation 'com.squareup.okhttp3:okhttp:3.14.9'
            implementation 'com.squareup.okio:okio:3.7.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
            implementation 'androidx.core:core-ktx:1.5.0'
            implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
            implementation 'androidx.browser:browser:1.8.0'
            implementation 'com.squareup.picasso:picasso:2.8' 
        }
        EOF
    - name: Create settings.gradle
      shell: bash
      run: |
        cat > android/settings.gradle <<'EOF'
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.12.1" apply false
            id "org.jetbrains.kotlin.android" version "2.2.0" apply false
            id "com.google.gms.google-services" version "4.4.0" apply false
        }

        include ':app'
        EOF
    - name: Create root build.gradle
      shell: bash
      run: |
        cat > android/build.gradle <<'EOF'
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }

        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF
    - name: Create gradle.properties
      shell: bash
      run: |
        cat > android/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx2048M
        android.useAndroidX=true
        android.enableJetifier=true
        android.enableR8.fullMode=false
        org.gradle.vfs.watch=false
        org.gradle.logging.stacktrace=all
        org.gradle.console=plain
        EOF
    - name: Generate launcher icons
      run: dart run flutter_launcher_icons
    - name: Build release APK
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        MAYAJAAL_TERABOX_RESOLVER: ${{ vars.MAYAJAAL_TERABOX_RESOLVER }}
        MAYAJAAL_SOCIAL_RESOLVER: ${{ vars.MAYAJAAL_SOCIAL_RESOLVER }}
        MAYAJAAL_CHANNEL_UPLOAD: ${{ vars.MAYAJAAL_CHANNEL_UPLOAD }}
        MAYA_LIVE_API: ${{ vars.MAYA_LIVE_API }}
        MAYA_ADS_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release }}
        MAYA_VAST_TEST_TAG: ${{ vars.MAYA_VAST_TEST_TAG }}
        MAYA_ADS_CONTEXTUAL_APPROVED: ${{ vars.MAYA_ADS_CONTEXTUAL_APPROVED }}
        MAYA_STARTIO_CONTEXTUAL_APPROVED: ${{ vars.MAYA_STARTIO_CONTEXTUAL_APPROVED }}
        MAYA_STARTIO_APPROVED: ${{ vars.MAYA_STARTIO_APPROVED }}
        MAYA_INMOBI_APPROVED: ${{ vars.MAYA_ADS_PRODUCTION_APPROVED }}
        MAYA_ADS_ENABLED: ${{ (github.event_name == 'push' && (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.ads_enabled && (inputs.ads_trial || (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true'))) }}
      run: |
        set -euo pipefail
        args=(--release --build-name="$MAYAJAAL_BUILD_NAME" --build-number="$MAYAJAAL_BUILD_NUMBER")
        if [[ "$MAYA_ADS_TRIAL" == "true" ]]; then
          args+=(--dart-define=MAYA_ADS_TRIAL=true)
          if [[ -n "$MAYA_VAST_TEST_TAG" ]]; then args+=("--dart-define=MAYA_VAST_TEST_TAG=$MAYA_VAST_TEST_TAG"); fi
        fi
        if [[ "$MAYA_ADS_ENABLED" == "true" ]]; then args+=(--dart-define=MAYA_ADS_ENABLED=true); fi
        if [[ "$MAYA_ADS_ENABLED" == "true" && "$MAYA_ADS_TRIAL" != "true" && "$MAYA_ADS_CONTEXTUAL_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_ADS_CONTEXTUAL_APPROVED=true); fi
        if [[ "$MAYA_ADS_ENABLED" == "true" ]]; then
          if [[ "$MAYA_ADS_TRIAL" == "true" || "$MAYA_STARTIO_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_STARTIO_ENABLED=true); fi
          if [[ "$MAYA_ADS_TRIAL" == "true" || "$MAYA_INMOBI_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_INMOBI_ENABLED=true); fi
          if [[ "$MAYA_STARTIO_CONTEXTUAL_APPROVED" == "true" && "$MAYA_ADS_TRIAL" != "true" ]]; then args+=(--dart-define=MAYA_STARTIO_CONTEXTUAL_APPROVED=true); fi
        fi
        # Omit blank values so String.fromEnvironment defaults in Dart still work.
        for name in MAYAJAAL_TERABOX_RESOLVER MAYAJAAL_SOCIAL_RESOLVER MAYAJAAL_CHANNEL_UPLOAD MAYA_LIVE_API; do
          value="${!name}"
          if [[ -n "$value" ]]; then args+=("--dart-define=$name=$value"); fi
        done
        flutter build apk "${args[@]}"
      shell: bash
    - name: Verify and stage APK
      shell: bash
      run: |
        set -euo pipefail
        apk="build/app/outputs/flutter-apk/app-release.apk"
        test -s "$apk" || { echo "::error::APK output missing."; exit 1; }
        mkdir -p release-builds
        cp "$apk" release-builds/MayaJaal.apk
        signer=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -n "$signer" || { echo "::error::apksigner missing from Android SDK."; exit 1; }
        "$signer" verify --verbose release-builds/MayaJaal.apk
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ (github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release) && 'MayaJaal-ADS-TEST-APK' || 'MayaJaal-APK' }}
        path: release-builds/MayaJaal.apk
        if-no-files-found: error
    - name: Build release AAB
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        MAYAJAAL_TERABOX_RESOLVER: ${{ vars.MAYAJAAL_TERABOX_RESOLVER }}
        MAYAJAAL_SOCIAL_RESOLVER: ${{ vars.MAYAJAAL_SOCIAL_RESOLVER }}
        MAYAJAAL_CHANNEL_UPLOAD: ${{ vars.MAYAJAAL_CHANNEL_UPLOAD }}
        MAYA_LIVE_API: ${{ vars.MAYA_LIVE_API }}
        MAYA_ADS_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release }}
        MAYA_VAST_TEST_TAG: ${{ vars.MAYA_VAST_TEST_TAG }}
        MAYA_ADS_CONTEXTUAL_APPROVED: ${{ vars.MAYA_ADS_CONTEXTUAL_APPROVED }}
        MAYA_STARTIO_CONTEXTUAL_APPROVED: ${{ vars.MAYA_STARTIO_CONTEXTUAL_APPROVED }}
        MAYA_STARTIO_APPROVED: ${{ vars.MAYA_STARTIO_APPROVED }}
        MAYA_INMOBI_APPROVED: ${{ vars.MAYA_ADS_PRODUCTION_APPROVED }}
        MAYA_ADS_ENABLED: ${{ (github.event_name == 'push' && (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.ads_enabled && (inputs.ads_trial || (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true'))) }}
      run: |
        set -euo pipefail
        args=(--release --build-name="$MAYAJAAL_BUILD_NAME" --build-number="$MAYAJAAL_BUILD_NUMBER")
        if [[ "$MAYA_ADS_TRIAL" == "true" ]]; then
          args+=(--dart-define=MAYA_ADS_TRIAL=true)
          if [[ -n "$MAYA_VAST_TEST_TAG" ]]; then args+=("--dart-define=MAYA_VAST_TEST_TAG=$MAYA_VAST_TEST_TAG"); fi
        fi
        if [[ "$MAYA_ADS_ENABLED" == "true" ]]; then args+=(--dart-define=MAYA_ADS_ENABLED=true); fi
        if [[ "$MAYA_ADS_ENABLED" == "true" && "$MAYA_ADS_TRIAL" != "true" && "$MAYA_ADS_CONTEXTUAL_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_ADS_CONTEXTUAL_APPROVED=true); fi
        if [[ "$MAYA_ADS_ENABLED" == "true" ]]; then
          if [[ "$MAYA_ADS_TRIAL" == "true" || "$MAYA_STARTIO_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_STARTIO_ENABLED=true); fi
          if [[ "$MAYA_ADS_TRIAL" == "true" || "$MAYA_INMOBI_APPROVED" == "true" ]]; then args+=(--dart-define=MAYA_INMOBI_ENABLED=true); fi
          if [[ "$MAYA_STARTIO_CONTEXTUAL_APPROVED" == "true" && "$MAYA_ADS_TRIAL" != "true" ]]; then args+=(--dart-define=MAYA_STARTIO_CONTEXTUAL_APPROVED=true); fi
        fi
        # Omit blank values so String.fromEnvironment defaults in Dart still work.
        for name in MAYAJAAL_TERABOX_RESOLVER MAYAJAAL_SOCIAL_RESOLVER MAYAJAAL_CHANNEL_UPLOAD MAYA_LIVE_API; do
          value="${!name}"
          if [[ -n "$value" ]]; then args+=("--dart-define=$name=$value"); fi
        done
        flutter build appbundle "${args[@]}"
      shell: bash
    - name: Verify and stage AAB
      shell: bash
      run: |
        set -euo pipefail
        aab="build/app/outputs/bundle/release/app-release.aab"
        test -s "$aab" || { echo "::error::AAB output missing."; exit 1; }
        mkdir -p release-builds
        cp "$aab" release-builds/MayaJaal.aab
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ (github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release) && 'MayaJaal-ADS-TEST-AAB' || 'MayaJaal-AAB' }}
        path: release-builds/MayaJaal.aab
        if-no-files-found: error
    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.ads_trial
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.MAYAJAAL_BUILD_NAME }}-${{ env.MAYAJAAL_BUILD_NUMBER }}
        name: MayaJaal Release v${{ env.MAYAJAAL_BUILD_NAME }} Build ${{ env.MAYAJAAL_BUILD_NUMBER }}
        repository: MayaJaal1/MayaJaal-Downloads
        token: ${{ secrets.PAT_TOKEN }}
        files: |
          release-builds/MayaJaal.apk
          release-builds/MayaJaal.aab
        body: |
          MayaJaal Android Release.
          Version: ${{ env.MAYAJAAL_BUILD_NAME }}
          Version Code: ${{ env.MAYAJAAL_BUILD_NUMBER }}
          Signed with the existing MayaJaal release key. Test playback, login, uploads and notifications on a real device before public distribution.
        draft: false
        prerelease: false
    - name: Show troubleshooting summary on failure
      if: ${{ failure() }}
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
        ## MayaJaal build stopped
        Open the first red step above and read its final error lines.

        - Missing file: add that project file at the exact path shown.
        - Signing check: set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS to values for your existing mayajaal-release.jks.
        - Analyze app source: fix the Dart errors printed in that step; warnings/infos do not fail this workflow.
        - APK/AAB build: the log will show the actual Gradle, Android or dependency error.
        - An APK uploaded before an AAB failure remains available under Artifacts.

        No new keystore was generated. If GitHub shows no job or steps at all, inspect the workflow run Summary/Annotations and Actions permissions/billing. In-job Gradle or Dart fixes cannot diagnose a job that never starts.
        SUMMARY
    timeout-minutes: 60
