name: Build MayaJaal APK
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish tested build to downloads repository
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: mayajaal-apk-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Verify required files
      shell: bash
      run: |
        set -euo pipefail
        for file in pubspec.yaml android/app/google-services.json assets/icon/logo.png lib/main.dart lib/live_adventures.dart mayajaal-release.jks; do
          test -f "$file" || { echo "::error::Required project file missing: $file"; exit 1; }
        done
        python3 - <<'PYFIREBASE'
        import json, pathlib
        config=json.loads(pathlib.Path('android/app/google-services.json').read_text())
        packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in config.get('client',[])]
        if 'com.mayajaal.online' not in packages:
            raise SystemExit('::error::google-services.json needs an Android client for com.mayajaal.online. Use your existing Firebase Android app configuration.')
        print('Required files and Firebase Android package verified.')
        PYFIREBASE
    - name: Read release version from pubspec
      shell: bash
      run: |
        set -euo pipefail
        test -f pubspec.yaml || { echo "::error::pubspec.yaml missing"; exit 1; }
        python3 - <<'PYVERSION' >> "$GITHUB_ENV"
        import os, pathlib, re
        text = pathlib.Path('pubspec.yaml').read_text()
        match = re.search(r"(?m)^version:\s*['\"]?(\d+\.\d+\.\d+)\+(\d+)", text)
        if match is None:
            raise SystemExit('pubspec.yaml requires version: x.y.z+number')
        number = int(match[2]) + int(os.environ['GITHUB_RUN_NUMBER'])
        if not 0 < number <= 2100000000:
            raise SystemExit('Android version code out of range')
        print('MAYAJAAL_BUILD_NAME=' + match[1])
        print('MAYAJAAL_BUILD_NUMBER=' + str(number))
        PYVERSION
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Verify existing signing key and GitHub secrets
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for pair in MAYAJAAL_STORE_PASSWORD:ANDROID_KEYSTORE_PASSWORD MAYAJAAL_KEY_PASSWORD:ANDROID_KEY_PASSWORD MAYAJAAL_KEY_ALIAS:ANDROID_KEY_ALIAS; do
          variable="${pair%%:*}"
          secret_name="${pair#*:}"
          if [[ -z "${!variable}" ]]; then
            echo "::error::Missing GitHub Actions secret: $secret_name. Set its EXISTING keystore value in repository Settings > Secrets and variables > Actions."
            missing=1
          fi
        done
        [[ "$missing" == 0 ]] || exit 1
        if ! keytool -list -keystore mayajaal-release.jks -storepass:env MAYAJAAL_STORE_PASSWORD -alias "$MAYAJAAL_KEY_ALIAS" >/dev/null 2>&1; then
          echo "::error::Existing keystore could not be unlocked, or alias was not found. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. No new signing key was generated."
          exit 1
        fi
        # Import only into a temporary validation file; the original release keystore is never modified.
        check_dir=$(mktemp -d "${RUNNER_TEMP}/mayajaal-signing-check.XXXXXX")
        trap 'rm -rf "$check_dir"' EXIT
        if ! keytool -importkeystore -noprompt -srckeystore mayajaal-release.jks -srcstorepass:env MAYAJAAL_STORE_PASSWORD -srcalias "$MAYAJAAL_KEY_ALIAS" -srckeypass:env MAYAJAAL_KEY_PASSWORD -destkeystore "$check_dir/check.p12" -deststoretype PKCS12 -deststorepass:env MAYAJAAL_STORE_PASSWORD >/dev/null 2>&1; then
          echo "::error::The private signing key could not be opened. Check ANDROID_KEY_PASSWORD for the existing key."
          exit 1
        fi
        echo "Existing signing key and alias verified."
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.29.0
        channel: stable
        cache: true
    - name: Get Flutter dependencies
      run: flutter pub get
    - name: Fix better_player namespace and hashValues
      shell: bash
      run: |
        set -euo pipefail
        PLUGIN_PATH="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/better_player-0.0.84"
        test -d "$PLUGIN_PATH/lib" || { echo "::error::Expected better_player 0.0.84 was not found. Check the version in pubspec.yaml."; exit 1; }
        if ! grep -Eq '^[[:space:]]*namespace[[:space:]]' "$PLUGIN_PATH/android/build.gradle"; then
          sed -i '/^android {/a \    namespace "com.jhomlala.better_player"' "$PLUGIN_PATH/android/build.gradle"
        fi
        python3 - "$PLUGIN_PATH/lib" <<'PYPLUGIN'
        import pathlib,re,sys
        for path in pathlib.Path(sys.argv[1]).rglob('*.dart'):
            original=path.read_text()
            updated=re.sub(r'\bhashValues\s*\(', 'Object.hash(', original)
            if updated!=original:path.write_text(updated)
        PYPLUGIN
    - name: Analyze app source
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
    - name: Install Android SDK and align Gradle wrapper
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        test -n "$sdk_root" || { echo "::error::Android SDK location was not provided by the runner."; exit 1; }
        manager=$(command -v sdkmanager || true)
        if [[ -z "$manager" ]]; then manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"; fi
        test -x "$manager" || { echo "::error::sdkmanager was not found on this runner."; exit 1; }
        "$manager" --sdk_root="$sdk_root" --licenses < <(yes) >/dev/null
        "$manager" --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
        python3 - <<'PYGRADLE'
        import os,pathlib
        props=pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
        props.parent.mkdir(parents=True,exist_ok=True)
        existing=props.read_text().splitlines() if props.is_file() else [
            'distributionBase=GRADLE_USER_HOME', 'distributionPath=wrapper/dists',
            'zipStoreBase=GRADLE_USER_HOME', 'zipStorePath=wrapper/dists']
        lines=[line for line in existing if not line.startswith(('distributionUrl=','distributionSha256Sum='))]
        lines += [r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip',
                  'distributionSha256Sum=89d4e70e4e84e2d2dfbb63e4daa53e21b25017cc70c37e4eea31ee51fb15098a']
        props.write_text('\n'.join(lines)+'\n')
        flutter=os.environ.get('FLUTTER_ROOT')
        if not flutter:raise SystemExit('::error::Flutter SDK path is missing.')
        sdk=os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME')
        def prop(value):return value.replace('\\','\\\\').replace(':','\\:')
        pathlib.Path('android/local.properties').write_text('sdk.dir='+prop(sdk)+'\nflutter.sdk='+prop(flutter)+'\n')
        PYGRADLE
        # Flutter 3.29 restores missing wrapper scripts/JAR from its own SDK cache at build time.
        # They are normally ignored by Flutter's generated Android .gitignore.
        if [[ -f android/gradlew ]]; then chmod +x android/gradlew; fi
    - name: Prepare Android project
      shell: bash
      run: |
        set -euo pipefail
        # This workflow owns these generated Gradle files. Keep one DSL per generated file.
        rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
        mkdir -p android/app/src/main/kotlin/com/mayajaal/online
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/values-night
        mkdir -p android/app/src/main/res/xml
        cp mayajaal-release.jks android/app/mayajaal-release.jks

        cat > android/app/src/main/kotlin/com/mayajaal/online/MainActivity.kt <<'EOF'
        package com.mayajaal.online
        import io.flutter.embedding.android.FlutterActivity
        import android.content.Intent
        import android.view.WindowManager
        import java.util.ArrayDeque
        import io.flutter.embedding.engine.FlutterEngine
        import io.flutter.plugin.common.MethodChannel

        class MainActivity : FlutterActivity() {
            private val pending = ArrayDeque<String>()
            private var shareChannel: MethodChannel? = null

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)
                captureShare(intent)
                shareChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mayajaal/share")
                shareChannel?.setMethodCallHandler { call, result ->
                    when (call.method) {
                        "keepScreenOn" -> {
                                if (call.arguments == true) {
                                    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                } else {
                                    window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                }
                                result.success(null)
                            }
                            "takeSharedText" -> result.success(pending.pollFirst())
                        else -> result.notImplemented()
                    }
                }
            }

            override fun onPause() {
                window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                super.onPause()
            }

            override fun onNewIntent(intent: Intent) {
                super.onNewIntent(intent)
                captureShare(intent)
                shareChannel?.invokeMethod("shareAvailable", null)
            }

            private fun captureShare(intent: Intent?) {
                if (intent?.action != Intent.ACTION_SEND || intent.type != "text/plain") return
                val text = intent.getCharSequenceExtra(Intent.EXTRA_TEXT)?.toString() ?: return
                pending.addLast(text)
                intent.removeExtra(Intent.EXTRA_TEXT)
            }
        }
        EOF

        cat > android/app/src/main/res/values/styles.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">@android:color/white</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                <item name="android:windowBackground">?android:colorBackground</item>
            </style>
        </resources>
        EOF

        cat > android/app/src/main/res/values-night/styles.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                <item name="android:windowBackground">@android:color/black</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                <item name="android:windowBackground">?android:colorBackground</item>
            </style>
        </resources>
        EOF
    - name: Create Network Security Config
      shell: bash
      run: |
        cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <network-security-config>
            <base-config cleartextTrafficPermitted="true">
                <trust-anchors>
                    <certificates src="system" />
                </trust-anchors>
            </base-config>
            <domain-config cleartextTrafficPermitted="true">
                <domain includeSubdomains="true">mayajaal.online</domain>
                <domain includeSubdomains="true">www.mayajaal.online</domain>
                <domain includeSubdomains="true">m.mayajaal.online</domain>
                <domain includeSubdomains="true">mayajaal-app.firebaseapp.com</domain>
                <domain includeSubdomains="true">mayajaal-app-default-rtdb.asia-southeast1.firebasedatabase.app</domain>
                <domain includeSubdomains="true">mayajaal-app.firebasestorage.app</domain>
                <domain includeSubdomains="true">googleapis.com</domain>
                <domain includeSubdomains="true">gstatic.com</domain>
                <domain includeSubdomains="true">onesignal.com</domain>
                <domain includeSubdomains="true">r2.dev</domain>
                <domain includeSubdomains="true">cloudflarestorage.com</domain>
                <domain includeSubdomains="true">t.me</domain>
                <domain includeSubdomains="true">telegram.org</domain>
                <domain includeSubdomains="true">youtube.com</domain>
                <domain includeSubdomains="true">instagram.com</domain>
                <trust-anchors>
                    <certificates src="system" />
                </trust-anchors>
            </domain-config>
        </network-security-config>
        EOF
    - name: Create AndroidManifest.xml
      shell: bash
      run: |
        cat > android/app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">

            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
            <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
            <uses-feature android:name="android.hardware.microphone" android:required="false"/>

            <application
                android:label="MayaJaal"
                android:name="${applicationName}"
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:networkSecurityConfig="@xml/network_security_config"
                android:usesCleartextTraffic="true"
                tools:targetApi="35">

                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2838903415772756~9180315931"/>
                <meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.onesignal.notifications.internal.service.impl.NotificationServiceExtension"/>

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:supportsPictureInPicture="true"
                    android:resizeableActivity="true"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">

                    <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>

                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>

                    <intent-filter>
                        <action android:name="android.intent.action.SEND"/>
                        <category android:name="android.intent.category.DEFAULT"/>
                        <data android:mimeType="text/plain"/>
                    </intent-filter>

                    <intent-filter android:autoVerify="true">
                        <action android:name="android.intent.action.VIEW"/>
                        <category android:name="android.intent.category.DEFAULT"/>
                        <category android:name="android.intent.category.BROWSABLE"/>
                        <data android:scheme="https" android:host="mayajaal.online" android:pathPrefix="/v/"/>
                        <data android:scheme="https" android:host="mayajaal.online" android:pathPrefix="/stream/"/>
                        <data android:scheme="https" android:host="mayajaal.online" android:pathPrefix="/api/v/"/>
                        <data android:scheme="https" android:host="mayajaal.online" android:pathPrefix="/s/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/v/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/stream/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/api/v/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/s/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/channel/"/>
                        <data android:scheme="https" android:host="www.mayajaal.online" android:pathPrefix="/tb/"/>
                        <data android:scheme="https" android:host="mayajaal.online" android:pathPrefix="/channel/"/>
                        <data android:scheme="https" android:host="m.mayajaal.online"/>
                    </intent-filter>

                    <intent-filter>
                        <action android:name="android.intent.action.VIEW"/>
                        <category android:name="android.intent.category.DEFAULT"/>
                        <category android:name="android.intent.category.BROWSABLE"/>
                        <data android:scheme="mayajaall"/>
                    </intent-filter>
                </activity>

                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2"/>
            </application>

            <queries>
                <intent>
                    <action android:name="android.intent.action.PROCESS_TEXT"/>
                    <data android:mimeType="text/plain"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="https"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="http"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SENDTO"/>
                    <data android:scheme="mailto"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SEND"/>
                    <data android:mimeType="text/plain"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.SEND"/>
                    <data android:mimeType="image/*"/>
                </intent>
            </queries>
        </manifest>
        EOF
    - name: Create app build.gradle
      shell: bash
      run: |
        cat > android/app/build.gradle <<'EOF'
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "com.google.gms.google-services"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace 'com.mayajaal.online'
            compileSdkVersion 36
            ndkVersion "27.0.12077973"

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
                coreLibraryDesugaringEnabled true
            }

            kotlinOptions {
                jvmTarget = '17'
            }

            defaultConfig {
                applicationId "com.mayajaal.online"
                minSdkVersion 23
                targetSdkVersion 35
                versionCode flutter.versionCode
                versionName flutter.versionName
                multiDexEnabled true
            }

            signingConfigs {
                release {
                    storeFile file('mayajaal-release.jks')
                    storePassword System.getenv('MAYAJAAL_STORE_PASSWORD')
                    keyAlias System.getenv('MAYAJAAL_KEY_ALIAS')
                    keyPassword System.getenv('MAYAJAAL_KEY_PASSWORD')
                }
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        dependencies {
            coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
            implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
            implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
        }
        EOF
    - name: Create settings.gradle
      shell: bash
      run: |
        cat > android/settings.gradle <<'EOF'
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.10.1" apply false
            id "org.jetbrains.kotlin.android" version "2.1.0" apply false
            id "com.google.gms.google-services" version "4.4.0" apply false
        }

        include ':app'
        EOF
    - name: Create root build.gradle
      shell: bash
      run: |
        cat > android/build.gradle <<'EOF'
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.buildDir = '../build'
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(':app')
        }

        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        EOF
    - name: Create gradle.properties
      shell: bash
      run: |
        cat > android/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx2048M
        android.useAndroidX=true
        android.enableJetifier=true
        android.enableR8.fullMode=false
        EOF
    - name: Generate launcher icons
      run: dart run flutter_launcher_icons
    - name: Build release APK
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        MAYAJAAL_TERABOX_RESOLVER: ${{ vars.MAYAJAAL_TERABOX_RESOLVER }}
        MAYAJAAL_SOCIAL_RESOLVER: ${{ vars.MAYAJAAL_SOCIAL_RESOLVER }}
        MAYAJAAL_CHANNEL_UPLOAD: ${{ vars.MAYAJAAL_CHANNEL_UPLOAD }}
      run: |
        set -euo pipefail
        args=(--release --build-name="$MAYAJAAL_BUILD_NAME" --build-number="$MAYAJAAL_BUILD_NUMBER")
        # Omit blank values so String.fromEnvironment defaults in Dart still work.
        for name in MAYAJAAL_TERABOX_RESOLVER MAYAJAAL_SOCIAL_RESOLVER MAYAJAAL_CHANNEL_UPLOAD; do
          value="${!name}"
          if [[ -n "$value" ]]; then args+=("--dart-define=$name=$value"); fi
        done
        flutter build apk "${args[@]}"
      shell: bash
    - name: Verify and stage APK
      shell: bash
      run: |
        set -euo pipefail
        apk="build/app/outputs/flutter-apk/app-release.apk"
        test -s "$apk" || { echo "::error::APK output missing."; exit 1; }
        mkdir -p release-builds
        cp "$apk" release-builds/MayaJaal.apk
        signer=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
        test -n "$signer" || { echo "::error::apksigner missing from Android SDK."; exit 1; }
        "$signer" verify --verbose release-builds/MayaJaal.apk
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: MayaJaal-APK
        path: release-builds/MayaJaal.apk
        if-no-files-found: error
    - name: Build release AAB
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        MAYAJAAL_TERABOX_RESOLVER: ${{ vars.MAYAJAAL_TERABOX_RESOLVER }}
        MAYAJAAL_SOCIAL_RESOLVER: ${{ vars.MAYAJAAL_SOCIAL_RESOLVER }}
        MAYAJAAL_CHANNEL_UPLOAD: ${{ vars.MAYAJAAL_CHANNEL_UPLOAD }}
      run: |
        set -euo pipefail
        args=(--release --build-name="$MAYAJAAL_BUILD_NAME" --build-number="$MAYAJAAL_BUILD_NUMBER")
        # Omit blank values so String.fromEnvironment defaults in Dart still work.
        for name in MAYAJAAL_TERABOX_RESOLVER MAYAJAAL_SOCIAL_RESOLVER MAYAJAAL_CHANNEL_UPLOAD; do
          value="${!name}"
          if [[ -n "$value" ]]; then args+=("--dart-define=$name=$value"); fi
        done
        flutter build appbundle "${args[@]}"
      shell: bash
    - name: Verify and stage AAB
      shell: bash
      run: |
        set -euo pipefail
        aab="build/app/outputs/bundle/release/app-release.aab"
        test -s "$aab" || { echo "::error::AAB output missing."; exit 1; }
        mkdir -p release-builds
        cp "$aab" release-builds/MayaJaal.aab
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: MayaJaal-AAB
        path: release-builds/MayaJaal.aab
        if-no-files-found: error
    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.MAYAJAAL_BUILD_NAME }}-${{ env.MAYAJAAL_BUILD_NUMBER }}
        name: MayaJaal Release v${{ env.MAYAJAAL_BUILD_NAME }} Build ${{ env.MAYAJAAL_BUILD_NUMBER }}
        repository: MayaJaal1/MayaJaal-Downloads
        token: ${{ secrets.PAT_TOKEN }}
        files: |
          release-builds/MayaJaal.apk
          release-builds/MayaJaal.aab
        body: |
          MayaJaal Android Release.
          Version: ${{ env.MAYAJAAL_BUILD_NAME }}
          Version Code: ${{ env.MAYAJAAL_BUILD_NUMBER }}
          Signed with the existing MayaJaal release key. Test playback, login, uploads and notifications on a real device before public distribution.
        draft: false
        prerelease: false
    - name: Show troubleshooting summary on failure
      if: ${{ failure() }}
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
        ## MayaJaal build stopped
        Open the first red step above and read its final error lines.

        - Missing file: add that project file at the exact path shown.
        - Signing check: set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS to values for your existing mayajaal-release.jks.
        - Analyze app source: fix the Dart errors printed in that step; warnings/infos do not fail this workflow.
        - APK/AAB build: the log will show the actual Gradle, Android or dependency error.
        - An APK uploaded before an AAB failure remains available under Artifacts.

        No new keystore was generated. If GitHub shows no job or steps at all, inspect the workflow run Summary/Annotations and Actions permissions/billing. In-job Gradle or Dart fixes cannot diagnose a job that never starts.
        SUMMARY
    timeout-minutes: 60
