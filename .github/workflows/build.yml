name: Build MayaJaal APK
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish tested build to downloads repository
        type: boolean
        default: false
      ads_trial:
        description: Optional private test lab (leave OFF for normal earnings build)
        type: boolean
        default: false
      ads_enabled:
        description: Enable automatic Start.io and InMobi placements (test mode for trial; approval required for production)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: mayajaal-apk-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Confirm build mode
      shell: bash
      env:
        ADS_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release }}
        PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        TRIAL_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ads_trial }}
        ADS_REQUESTED: ${{ (github.event_name == 'push' && (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.ads_enabled) }}
        ADS_APPROVED: ${{ vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true' }}
      run: |
        set -euo pipefail
        if [[ "$PUBLISH_RELEASE" == "true" && "$TRIAL_REQUESTED" == "true" ]]; then
          echo "::error::Uncheck ads_trial before publishing a public release."
          exit 1
        fi
        if [[ "$ADS_REQUESTED" == "true" && "$ADS_TRIAL" != "true" && "$ADS_APPROVED" != "true" ]]; then
          echo "::error::Production ads are locked. Verify network live eligibility; set MAYA_STARTIO_APPROVED=true for Start.io or MAYA_ADS_PRODUCTION_APPROVED=true for InMobi. For testing select ads_trial."
          exit 1
        fi
        if [[ "$ADS_TRIAL" == "true" ]]; then
          grep -Fq "MAYA_ADS_TRIAL" lib/main.dart || { echo "::error::Updated lib/main.dart with Ads Test Lab is missing."; exit 1; }
          echo "Ads Test Lab: ENABLED (private test APK only)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "Ads Test Lab: DISABLED" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$ADS_REQUESTED" == "true" && "$ADS_APPROVED" == "true" ]]; then
            echo "Approved ad networks enabled. Confirm live mode in provider dashboards." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Ads disabled for this build (no production approval or ads not requested)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        fi
    - name: Verify required files
      shell: bash
      run: |
        set -euo pipefail
        for file in pubspec.yaml android/app/google-services.json assets/icon/logo.png lib/main.dart lib/maya_ads.dart lib/live_adventures.dart mayajaal-release.jks; do
          test -f "$file" || { echo "::error::Required project file missing: $file"; exit 1; }
        done
        python3 - <<'PYFIREBASE'
        import json, pathlib
        config=json.loads(pathlib.Path('android/app/google-services.json').read_text())
        packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in config.get('client',[])]
        if 'com.mayajaal.online' not in packages:
            raise SystemExit('::error::google-services.json needs an Android client for com.mayajaal.online. Use your existing Firebase Android app configuration.')
        print('Required files and Firebase Android package verified.')
        PYFIREBASE
    - name: Read release version from pubspec
      shell: bash
      run: |
        set -euo pipefail
        test -f pubspec.yaml || { echo "::error::pubspec.yaml missing"; exit 1; }
        python3 - <<'PYVERSION' >> "$GITHUB_ENV"
        import os, pathlib, re
        text = pathlib.Path('pubspec.yaml').read_text()
        match = re.search(r"(?m)^version:\s*['\"]?(\d+\.\d+\.\d+)\+(\d+)", text)
        if match is None:
            raise SystemExit('pubspec.yaml requires version: x.y.z+number')
        number = int(match[2]) + int(os.environ['GITHUB_RUN_NUMBER'])
        if not 0 < number <= 2100000000:
            raise SystemExit('Android version code out of range')
        print('MAYAJAAL_BUILD_NAME=' + match[1])
        print('MAYAJAAL_BUILD_NUMBER=' + str(number))
        PYVERSION
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Verify existing signing key and GitHub secrets
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for pair in MAYAJAAL_STORE_PASSWORD:ANDROID_KEYSTORE_PASSWORD MAYAJAAL_KEY_PASSWORD:ANDROID_KEY_PASSWORD MAYAJAAL_KEY_ALIAS:ANDROID_KEY_ALIAS; do
          variable="${pair%%:*}"
          secret_name="${pair#*:}"
          if [[ -z "${!variable}" ]]; then
            echo "::error::Missing GitHub Actions secret: $secret_name. Set its EXISTING keystore value in repository Settings > Secrets and variables > Actions."
            missing=1
          fi
        done
        [[ "$missing" == 0 ]] || exit 1
        if ! keytool -list -keystore mayajaal-release.jks -storepass:env MAYAJAAL_STORE_PASSWORD >/dev/null 2>&1; then
          echo "::error::The repository keystore cannot be opened. ANDROID_KEYSTORE_PASSWORD does not unlock this file, or the file is invalid. Verify the original mayajaal-release.jks and its store password."
          exit 1
        fi
        if ! keytool -list -keystore mayajaal-release.jks -storepass:env MAYAJAAL_STORE_PASSWORD -alias "$MAYAJAAL_KEY_ALIAS" >/dev/null 2>&1; then
          echo "::error::Keystore password accepted, but ANDROID_KEY_ALIAS was not found in this keystore. Set its exact existing alias."
          exit 1
        fi
        # Import only into a temporary validation file; the original release keystore is never modified.
        check_dir=$(mktemp -d "${RUNNER_TEMP}/mayajaal-signing-check.XXXXXX")
        trap 'rm -rf "$check_dir"' EXIT
        if ! keytool -importkeystore -noprompt -srckeystore mayajaal-release.jks -srcstorepass:env MAYAJAAL_STORE_PASSWORD -srcalias "$MAYAJAAL_KEY_ALIAS" -srckeypass:env MAYAJAAL_KEY_PASSWORD -destkeystore "$check_dir/check.p12" -deststoretype PKCS12 -deststorepass:env MAYAJAAL_STORE_PASSWORD >/dev/null 2>&1; then
          echo "::error::The private signing key could not be opened. Check ANDROID_KEY_PASSWORD for the existing key."
          exit 1
        fi
        echo "Existing signing key and alias verified."
      env:
        MAYAJAAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        MAYAJAAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        MAYAJAAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.29.0
        channel: stable
        cache: true
    - name: Get Flutter dependencies
      run: flutter pub get
    - name: Fix better_player namespace and hashValues
      shell: bash
      run: |
        set -euo pipefail
        PLUGIN_PATH="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/better_player-0.0.84"
        test -d "$PLUGIN_PATH/lib" || { echo "::error::Expected better_player 0.0.84 was not found. Check the version in pubspec.yaml."; exit 1; }
        if ! grep -Eq '^[[:space:]]*namespace[[:space:]]' "$PLUGIN_PATH/android/build.gradle"; then
          sed -i '/^android {/a \    namespace "com.jhomlala.better_player"' "$PLUGIN_PATH/android/build.gradle"
        fi
        python3 - "$PLUGIN_PATH/lib" <<'PYPLUGIN'
        import pathlib,re,sys
        for path in pathlib.Path(sys.argv[1]).rglob('*.dart'):
            original=path.read_text()
            updated=re.sub(r'\bhashValues\s*\(', 'Object.hash(', original)
            if updated!=original:path.write_text(updated)
        PYPLUGIN
    - name: Analyze app source
      run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
    - name: Install Android SDK and align Gradle wrapper
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        test -n "$sdk_root" || { echo "::error::Android SDK location was not provided by the runner."; exit 1; }
        manager=$(command -v sdkmanager || true)
        if [[ -z "$manager" ]]; then manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"; fi
        test -x "$manager" || { echo "::error::sdkmanager was not found on this runner."; exit 1; }
        "$manager" --sdk_root="$sdk_root" --licenses < <(yes) >/dev/null
        "$manager" --sdk_root="$sdk_root" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
        python3 - <<'PYGRADLE'
        import os,pathlib
        props=pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
        props.parent.mkdir(parents=True,exist_ok=True)
        existing=props.read_text().splitlines() if props.is_file() else [
            'distributionBase=GRADLE_USER_HOME', 'distributionPath=wrapper/dists',
            'zipStoreBase=GRADLE_USER_HOME', 'zipStorePath=wrapper/dists']
        lines=[line for line in existing if not line.startswith(('distributionUrl=','distributionSha256Sum='))]
        lines += [r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip',
                  'distributionSha256Sum=fba8464465835e74f7270bbf43d6d8a8d7709ab0a43ce1aa3323f73e9aa0c612']
        props.write_text('\n'.join(lines)+'\n')
        flutter=os.environ.get('FLUTTER_ROOT')
        if not flutter:raise SystemExit('::error::Flutter SDK path is missing.')
        sdk=os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME')
        def prop(value):return value.replace('\\','\\\\').replace(':','\\:')
        pathlib.Path('android/local.properties').write_text('sdk.dir='+prop(sdk)+'\nflutter.sdk='+prop(flutter)+'\n')
        PYGRADLE
        # Flutter 3.29 restores missing wrapper scripts/JAR from its own SDK cache at build time.
        # They are normally ignored by Flutter's generated Android .gitignore.
        if [[ -f android/gradlew ]]; then chmod +x android/gradlew; fi
    - name: Prepare Android project
      shell: bash
      env:
        MAYA_START_APPROVED: ${{ vars.MAYA_STARTIO_APPROVED }}
        MAYA_INMOBI_APPROVED: ${{ vars.MAYA_ADS_PRODUCTION_APPROVED }}
        MAYA_NATIVE_TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.ads_trial && !inputs.publish_release }}
        MAYA_NATIVE_ADS: ${{ (github.event_name == 'push' && (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.ads_enabled && (inputs.ads_trial || (vars.MAYA_ADS_PRODUCTION_APPROVED == 'true' || vars.MAYA_STARTIO_APPROVED == 'true'))) }}
      run: |
        set -euo pipefail
        # This workflow owns these generated Gradle files. Keep one DSL per generated file.
        rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
        mkdir -p android/app/src/main/kotlin/com/mayajaal/online
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/values-night
        mkdir -p android/app/src/main/res/xml
        cp mayajaal-release.jks android/app/mayajaal-release.jks

        cat > android/app/src/main/kotlin/com/mayajaal/online/MainActivity.kt <<'EOF'
        package com.mayajaal.online
        import io.flutter.embedding.android.FlutterActivity
        import android.content.Intent
        import android.view.WindowManager
        import java.util.ArrayDeque
        import android.content.ContentValues
        import android.media.MediaScannerConnection
        import android.net.Uri
        import android.os.Build
        import android.os.Environment
        import android.provider.MediaStore
        import android.webkit.MimeTypeMap
        import java.io.File
        import java.util.Locale
        import java.util.concurrent.Executors
        import io.flutter.embedding.engine.FlutterEngine
        import io.flutter.plugin.common.MethodChannel

        class MainActivity : FlutterActivity() {
            private val pending = ArrayDeque<String>()
            private var shareChannel: MethodChannel? = null
            private var mayaAdsBridge: MayaAdsBridge? = null
            companion object {
                private val downloadIo = Executors.newSingleThreadExecutor()
            }

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)
                captureShare(intent)
                val ads = MayaAdsBridge(this, flutterEngine.dartExecutor.binaryMessenger)
                mayaAdsBridge = ads
                flutterEngine.platformViewsController.registry.registerViewFactory("mayajaal/inmobi_slot", ads.factory())
                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mayajaal/ads_trial")
                    .setMethodCallHandler { call, result ->
                        if (call.method == "open") {
                            if (!MayaAdsMode.TRIAL) {
                                result.error("ADS_TRIAL_DISABLED", "Developer test lab is disabled", null)
                                return@setMethodCallHandler
                            }
                            try {
                                startActivity(Intent(this, MayaAdsTrialActivity::class.java))
                                result.success(null)
                            } catch (e: Exception) {
                                result.error("ADS_TRIAL", e.message, null)
                            }
                        } else result.notImplemented()
                    }
                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mayajaal/downloads")
                    .setMethodCallHandler { call, result ->
                        if (call.method != "publish") {
                            result.notImplemented()
                        } else {
                            val path = call.argument<String>("path")
                            val name = call.argument<String>("name")
                            val mime = call.argument<String>("mime")
                            if (path == null || name == null) {
                                result.error("BAD_ARGUMENT", "Missing download information", null)
                            } else {
                                downloadIo.execute {
                                    try {
                                        val saved = publishDownload(path, name, mime)
                                        runOnUiThread { result.success(saved) }
                                    } catch (e: Exception) {
                                        runOnUiThread { result.error("PUBLIC_STORAGE", e.message, null) }
                                    }
                                }
                            }
                        }
                    }
                shareChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "mayajaal/share")
                shareChannel?.setMethodCallHandler { call, result ->
                    when (call.method) {
                        "keepScreenOn" -> {
                                if (call.arguments == true) {
                                    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                } else {
                                    window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                }
                                result.success(null)
                            }
                            "takeSharedText" -> result.success(pending.pollFirst())
                        else -> result.notImplemented()
                    }
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                mayaAdsBridge?.onActivityResult(requestCode, resultCode)
            }

            override fun onResume() {
                super.onResume()
                mayaAdsBridge?.resume()
            }

            override fun onDestroy() {
                mayaAdsBridge?.destroy()
                mayaAdsBridge = null
                super.onDestroy()
            }

            override fun onPause() {
                mayaAdsBridge?.pause()
                window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                super.onPause()
            }

            override fun onNewIntent(intent: Intent) {
                super.onNewIntent(intent)
                captureShare(intent)
                shareChannel?.invokeMethod("shareAvailable", null)
            }

            private fun publishDownload(path: String, name: String, suppliedMime: String?): String {
                val source = File(path).canonicalFile
                val privateRoot = File(filesDir, "downloads").canonicalFile
                require(source.path.startsWith(privateRoot.path + File.separator) && source.isFile && source.length() > 0) {
                    "Source must be a completed MayaJaal download"
                }
                require(!source.name.endsWith(".part") && name.isNotBlank() && name != "." && name != ".." && !name.contains('/') && !name.contains('\\') && name.none { it.isISOControl() }) {
                    "Invalid download name"
                }
                val prefs = getSharedPreferences("mayajaal_public_downloads", MODE_PRIVATE)
                val previous = prefs.getString(source.path, null)
                if (previous != null) {
                    val uri = Uri.parse(previous)
                    val exists = try {
                        if (uri.scheme == "file") File(uri.path!!).isFile
                        else contentResolver.openFileDescriptor(uri, "r")?.use { true } ?: false
                    } catch (_: Exception) { false }
                    if (exists) return previous
                }
                val extension = name.substringAfterLast('.', "").lowercase(Locale.ROOT)
                val guessed = when (extension) {
                    "mkv" -> "video/x-matroska"
                    "m4a" -> "audio/mp4"
                    "webm" -> "video/webm"
                    else -> MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension)
                }
                val mime = suppliedMime?.takeIf {
                    it.contains('/') && it != "application/octet-stream" && it != "binary/octet-stream"
                } ?: guessed ?: "application/octet-stream"
                val saved: String
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    val values = ContentValues().apply {
                        put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                        put(MediaStore.MediaColumns.MIME_TYPE, mime)
                        put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/MayaJaal/")
                        put(MediaStore.MediaColumns.IS_PENDING, 1)
                    }
                    val uri = contentResolver.insert(MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY), values)
                        ?: error("Could not create a public download")
                    try {
                        val output = contentResolver.openOutputStream(uri, "w")
                            ?: error("Could not open public download")
                        val bytes = output.use { target -> source.inputStream().use { it.copyTo(target) } }
                        check(bytes == source.length()) { "Incomplete public download" }
                        val published = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                        check(contentResolver.update(uri, published, null, null) > 0) { "Could not publish download" }
                    } catch (e: Exception) {
                        try { contentResolver.delete(uri, null, null) } catch (_: Exception) {}
                        throw e
                    }
                    // MediaStore indexes the item; request a best-effort rescan for
                    // gallery apps that additionally rely on the media scanner.
                    if (mime.startsWith("video/") || mime.startsWith("image/")) {
                        try {
                            @Suppress("DEPRECATION")
                            val mediaPath = contentResolver.query(uri, arrayOf(MediaStore.MediaColumns.DATA), null, null, null)?.use { cursor ->
                                if (cursor.moveToFirst()) cursor.getString(0) else null
                            }
                            if (!mediaPath.isNullOrBlank()) {
                                MediaScannerConnection.scanFile(this, arrayOf(mediaPath), arrayOf(mime), null)
                            }
                        } catch (_: Exception) { /* The public file is already published. */ }
                    }
                    saved = uri.toString()
                } else {
                    @Suppress("DEPRECATION")
                    val folder = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "MayaJaal")
                    check(folder.isDirectory || folder.mkdirs()) { "Cannot create public Downloads folder" }
                    val stem = name.substringBeforeLast('.', name)
                    val suffix = if (extension.isEmpty()) "" else "." + name.substringAfterLast('.')
                    var destination = File(folder, name)
                    var index = 1
                    while (!destination.createNewFile()) {
                        destination = File(folder, "$stem (${index++})$suffix")
                        check(index < 10000) { "Too many duplicate names" }
                    }
                    try {
                        val bytes = destination.outputStream().use { target -> source.inputStream().use { it.copyTo(target) } }
                        check(bytes == source.length()) { "Incomplete public download" }
                    } catch (e: Exception) {
                        destination.delete()
                        throw e
                    }
                    MediaScannerConnection.scanFile(this, arrayOf(destination.absolutePath), arrayOf(mime), null)
                    saved = Uri.fromFile(destination).toString()
                }
                prefs.edit().putString(source.path, saved).commit()
                return saved
            }

            private fun captureShare(intent: Intent?) {
                if (intent?.action != Intent.ACTION_SEND || intent.type != "text/plain") return
                val text = intent.getCharSequenceExtra(Intent.EXTRA_TEXT)?.toString() ?: return
                pending.addLast(text)
                intent.removeExtra(Intent.EXTRA_TEXT)
            }
        }
        EOF

        mkdir -p android/app/src/main/java/com/mayajaal/online
        trial=false; ads_enabled=false; start_enabled=false; inmobi_enabled=false
        if [[ "$MAYA_NATIVE_TRIAL" == "true" ]]; then trial=true; fi
        if [[ "$MAYA_NATIVE_ADS" == "true" ]]; then ads_enabled=true; fi
        if [[ "$ads_enabled" == "true" ]]; then
          if [[ "$trial" == "true" || "$MAYA_START_APPROVED" == "true" ]]; then start_enabled=true; fi
          if [[ "$trial" == "true" || "$MAYA_INMOBI_APPROVED" == "true" ]]; then inmobi_enabled=true; fi
        fi
        cat > android/app/src/main/java/com/mayajaal/online/MayaAdsMode.java <<EOFMODE
        package com.mayajaal.online;
        public final class MayaAdsMode {
            public static final boolean TRIAL = $trial;
            public static final boolean ENABLED = $ads_enabled;
            public static final boolean START = $start_enabled;
            public static final boolean INMOBI = $inmobi_enabled;
            private MayaAdsMode() {}
        }
        EOFMODE
        cat > android/app/src/main/java/com/mayajaal/online/MayaAdsBridge.java <<'EOFADBRIDGE'
        package com.mayajaal.online;

        import android.app.Activity;
        import android.content.Context;
        import android.graphics.Color;
        import android.os.Handler;
        import android.os.Looper;
        import android.util.Log;
        import android.view.Gravity;
        import android.view.View;
        import android.view.ViewGroup;
        import android.widget.*;
        import com.startapp.sdk.adsbase.StartAppSDK;
        import com.startapp.sdk.adsbase.StartAppAd;
        import com.startapp.sdk.adsbase.Ad;
        import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
        import com.startapp.sdk.adsbase.adlisteners.AdDisplayListener;
        import com.startapp.sdk.ads.banner.Banner;
        import com.startapp.sdk.ads.banner.BannerListener;
        import com.startapp.sdk.ads.nativead.StartAppNativeAd;
        import com.startapp.sdk.ads.nativead.NativeAdPreferences;
        import com.startapp.sdk.ads.nativead.NativeAdDetails;
        import com.inmobi.sdk.InMobiSdk;
        import com.inmobi.ads.*;
        import com.inmobi.ads.listeners.*;
        import com.inmobi.media.ads.nativeAd.InMobiNativeViewData;
        import com.squareup.picasso.Picasso;
        import io.flutter.plugin.common.BinaryMessenger;
        import io.flutter.plugin.common.MethodChannel;
        import io.flutter.plugin.common.StandardMessageCodec;
        import io.flutter.plugin.platform.PlatformView;
        import io.flutter.plugin.platform.PlatformViewFactory;
        import org.json.JSONObject;
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.Map;
        import java.util.function.Consumer;

        /** Native Android bridge. Requests require a permitted network and privacy configuration. */
        public final class MayaAdsBridge {
            private static final String TAG = "MayaAds";
            private static final String ACCOUNT = "a49ee54505e3485b8dec270ba7bb4182";
            private static final long BANNER=10000900525L, INTERSTITIAL=10000900530L, REWARDED=10000900538L, NATIVE=10000900548L;
            private final Activity activity;
            private final BinaryMessenger messenger;
            private final Handler ui = new Handler(Looper.getMainLooper());
            private final ArrayList<Consumer<Boolean>> waiting = new ArrayList<>();
            private final ArrayList<Slot> slots = new ArrayList<>();
            private boolean allowed, ready, initializing, closed, foreground;
            private boolean startAllowed, inmobiAllowed, startReady, startLoading, startShowing;
            private StartAppAd startFull;
            private int startEpoch;
            private boolean initStart() {
                if (!startAllowed || closed) return false;
                try {
                    if (!startReady) {
                        StartAppSDK.setTestAdsEnabled(MayaAdsMode.TRIAL);
                        StartAppSDK.init(activity, "210201394", false);
                        StartAppAd.disableSplash();
                        startReady=true;
                    }
                    // Do not claim consent to personalized advertising.
                    StartAppSDK.setUserConsent(activity,"pas",System.currentTimeMillis(),false);
                    return true;
                } catch (RuntimeException | LinkageError error) { Log.w(TAG,"Start.io init",error); startReady=false; return false; }
            }
            private int initGeneration;
            private InMobiInterstitial interstitial, rewarded;
            private boolean loadingInterstitial, showingInterstitial, showingReward, earned;
            private long lastInterstitial;
            private MethodChannel.Result pendingReward;
            private MethodChannel.Result pendingVideoTest;
            private static final int VIDEO_TEST_REQUEST = 4817;
            private final MethodChannel channel;
            public MayaAdsBridge(Activity a, BinaryMessenger m) {
