name: mayajaal
description: Mayajaal App
publish_to: 'none'
version: 1.3.2+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  app_links: ^6.3.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  webview_flutter: ^4.10.0
  video_player: ^2.8.2
  better_player: 0.0.84
  http: ^1.2.1
  share_plus: 10.1.4
  onesignal_flutter: ^5.2.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  file_picker: 8.3.7
  image_picker: 1.1.2
  photo_manager: ^3.6.4
  photo_manager_image_provider: ^2.1.1
  crypto: ^3.0.3
  livekit_client: ^2.3.0
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
