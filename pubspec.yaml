name: mayajaal
description: Mayajaal App - Secure Video Streaming & Monetization Platform
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

# ═══════════════════════════════════════════════════════
# DEPENDENCIES
# ═══════════════════════════════════════════════════════
dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ──
  cupertino_icons: ^1.0.6

  # ── Deep Links / URL / Storage ──
  app_links: ^6.3.2
  webview_flutter: ^4.7.0  # 🔥 Ye line ads ko app ke andar dikhane ke liye zaruri hai
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4

  # ── Authentication ──
  google_sign_in: ^6.2.1

  # ── Media / Video Player ──
  video_player: ^2.8.2
  chewie: ^1.8.1
  share_plus: ^9.0.0

  # ── Network ──
  http: ^1.2.1

  # ── Push Notifications ──
  onesignal_flutter: ^5.2.0

  # ── Firebase Core Services ──
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0

  # ── Device Info ──
  device_info_plus: ^10.1.2

  # ── 🔐 SECURITY: HMAC signing for API requests ──
  crypto: ^3.0.3

  # ── 📸 Gallery (permissions + assets) ──
  permission_handler: ^11.3.1
  photo_manager: ^3.3.0
  photo_manager_image_provider: ^2.1.1

  # ── 📺 Google IMA SDK for Pre-roll Ads (VAST Tags) ──
  # (Optional rakha hai, kyunki abhi hum WebView aur Direct link use kar rahe hain)
  interactive_media_ads: 0.2.6

# ═══════════════════════════════════════════════════════
# DEV DEPENDENCIES
# ═══════════════════════════════════════════════════════
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ═══════════════════════════════════════════════════════
# LAUNCHER ICONS
# ═══════════════════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/logo.png"

# ═══════════════════════════════════════════════════════
# FLUTTER CONFIG
# ═══════════════════════════════════════════════════════
flutter:
  uses-material-design: true
  
  # ── Assets ──
  assets:
    - assets/icon/
