name: mayajaal
description: Mayajaal App
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  app_links: ^6.3.2
  webview_flutter: ^4.7.0
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  permission_handler: ^11.3.0

  # 🌟 Video Player aur Stream ke liye zaroori packages
  video_player: ^2.8.2
  chewie: ^1.8.1
  http: ^1.2.1
  share_plus: ^9.0.0

  # 🔔 Push Notification Package
  onesignal_flutter: ^5.2.0

  # 🔥 Firebase Packages (View tracking aur Database ke liye)
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0

  # ⭐ NEW: Realtime Database (website dashboard + links sync)
  firebase_database: ^11.1.0
  firebase_auth: ^5.3.1

  # ⭐ NEW: Device ID (view counting ke liye unique device)
  device_info_plus: ^10.1.2

  # ⭐ NEW: Path provider (cache/temp files ke liye)
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
